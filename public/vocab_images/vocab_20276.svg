<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_20276" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11151c" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </linearGradient>
    <linearGradient id="glow_20276" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF202F" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF202F" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="radialGlow_20276" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF202F" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_20276" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="32" fill="url(#bg_20276)" stroke="#262626" stroke-width="3"/>
  <circle cx="300" cy="240" r="220" fill="url(#radialGlow_20276)"/>

  <!-- Top Educational Category Badge -->
  <g transform="translate(40, 36)">
    <rect width="180" height="32" rx="10" fill="#181818" stroke="#333" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#FF202F"/>
    <text x="32" y="21" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">
      ADVERTISING
    </text>
  </g>

  <!-- Level & Part of Speech Tag -->
  <g transform="translate(440, 36)">
    <rect width="120" height="32" rx="10" fill="#FF202F" fill-opacity="0.15" stroke="#FF202F" stroke-width="1.5"/>
    <text x="60" y="21" fill="#FF202F" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">
      NOUN
    </text>
  </g>

  <!-- Focal Central Concept Illustration Card -->
  <g transform="translate(50, 90)" filter="url(#shadow_20276)">
    <rect width="500" height="310" rx="24" fill="#141414" stroke="#2b2b2b" stroke-width="2"/>

    <!-- Decorative Illustration Viewport -->
    <g transform="translate(30, 25)">
      <!-- Backdrop grid lines -->
      <line x1="0" y1="120" x2="440" y2="120" stroke="#222" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="0" y1="200" x2="440" y2="200" stroke="#222" stroke-width="1"/>

      <!-- Focal Action Avatar / Scenario Scene Graphic -->
      <circle cx="220" cy="95" r="46" fill="#1f1f1f" stroke="#FF202F" stroke-width="2.5"/>
      <!-- Icon representation of action/person -->
      <circle cx="220" cy="80" r="16" fill="#ffffff"/>
      <path d="M 195 118 Q 220 95 245 118" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

      <!-- Interaction Elements around avatar -->
      <rect x="70" y="70" width="70" height="70" rx="14" fill="#1a1a1a" stroke="#333" stroke-width="1.5"/>
      <line x1="85" y1="90" x2="125" y2="90" stroke="#FF202F" stroke-width="3" stroke-linecap="round"/>
      <line x1="85" y1="105" x2="115" y2="105" stroke="#666" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="85" y1="120" x2="120" y2="120" stroke="#666" stroke-width="2.5" stroke-linecap="round"/>

      <rect x="300" y="70" width="70" height="70" rx="14" fill="#1a1a1a" stroke="#333" stroke-width="1.5"/>
      <circle cx="335" cy="105" r="14" fill="#FF202F" fill-opacity="0.2" stroke="#FF202F" stroke-width="2"/>
      <polyline points="330,105 334,109 342,100" fill="none" stroke="#FF202F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Connecting Context Arrows -->
      <path d="M 145 105 L 170 105" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="3,3"/>
      <path d="M 270 105 L 295 105" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="3,3"/>

      <!-- Clean Contextual Caption -->
      <rect x="0" y="210" width="440" height="50" rx="12" fill="#181818" stroke="#262626" stroke-width="1"/>
      <text x="220" y="238" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
        "món hời, sự mặc cả"
      </text>
    </g>
  </g>

  <!-- Visual Concept Description Box -->
  <g transform="translate(50, 420)">
    <rect width="500" height="145" rx="20" fill="#121212" stroke="#262626" stroke-width="1.5"/>

    <g transform="translate(24, 28)">
      <circle cx="6" cy="6" r="4" fill="#FF202F"/>
      <text x="18" y="10" fill="#FF202F" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">
        VISUAL CONCEPT (NGỮ CẢNH HỌC THỰC TẾ):
      </text>

      <text x="0" y="38" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="13" font-weight="500" leading="20">
        <tspan x="0" dy="0">An excited customer in an electronics store</tspan>
        <tspan x="0" dy="20">holding a boxed laptop. The box features a</tspan>
        <tspan x="0" dy="20">clear, large price tag where the original price...</tspan>
      </text>
    </g>
  </g>
</svg>